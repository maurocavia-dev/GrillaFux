name: Regenerate Provisioning Profile

on:
  workflow_dispatch:

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - name: List profiles, certs, then create new profile
        env:
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography requests
          python3 << 'PYEOF'
          import jwt, time, os, base64, requests, json
          from cryptography.hazmat.primitives import serialization
          KEY_ID = os.environ['API_KEY_ID']
          ISSUER_ID = os.environ['ISSUER_ID']
          KEY_B64 = os.environ['API_KEY_BASE64'].strip()
          if KEY_B64.startswith('-----BEGIN'): key_pem = KEY_B64.encode()
          else:
              try:
                  d = base64.b64decode(KEY_B64)
                  key_pem = d if b'-----BEGIN' in d else KEY_B64.encode()
              except: key_pem = KEY_B64.encode()
          pk = serialization.load_pem_private_key(key_pem, password=None)
          def tk():
              p = {'iss': ISSUER_ID, 'iat': int(time.time()), 'exp': int(time.time())+1200, 'aud': 'appstoreconnect-v1'}
              return jwt.encode(p, pk, algorithm='ES256', headers={'kid': KEY_ID, 'typ': 'JWT'})
          BASE = 'https://api.appstoreconnect.apple.com/v1'
          H = lambda ct=False: {'Authorization': f'Bearer {tk()}', 'Content-Type': 'application/json'} if ct else {'Authorization': f'Bearer {tk()}'}

          BUNDLE_ID_INTERNAL = 'B32465TYUA'

          # 1. Listar certificates de distribucion
          print('=== 1) Certificates ===')
          r = requests.get(f'{BASE}/certificates?limit=20', headers=H())
          dist_cert_id = None
          for c in r.json().get('data', []):
              a = c['attributes']
              cert_type = a.get('certificateType')
              name = a.get('name')
              cert_id = c['id']
              exp = a.get('expirationDate', '?')[:10]
              print(f'  - {cert_type}: {name} (id={cert_id}, exp={exp})')
              if cert_type in ('DISTRIBUTION', 'IOS_DISTRIBUTION'):
                  dist_cert_id = cert_id
                  print(f'    -> elegida como certificate de distribucion')

          if not dist_cert_id:
              print('ERROR: no se encontro certificate de distribucion')
              exit(1)

          # 2. Listar profiles actuales
          print('\n=== 2) Profiles actuales ===')
          r = requests.get(f'{BASE}/profiles?limit=20', headers=H())
          existing_profile_id = None
          existing_profile_name = None
          for p in r.json().get('data', []):
              a = p['attributes']
              print(f'  - {a.get("name")} | state={a.get("profileState")} | type={a.get("profileType")}')
              # Buscar el de nuestro app
              if 'GrillaFux' in str(a.get('name', '')) and a.get('profileType') == 'IOS_APP_STORE':
                  existing_profile_id = p['id']
                  existing_profile_name = a.get('name')

          # 3. Borrar el profile viejo (si existe)
          if existing_profile_id:
              print(f'\n=== 3) Borrando profile viejo: {existing_profile_name} ({existing_profile_id}) ===')
              r = requests.delete(f'{BASE}/profiles/{existing_profile_id}', headers=H())
              print(f'Delete status: {r.status_code}')

          # 4. Crear nuevo profile (ahora con la capability PUSH activa)
          print('\n=== 4) Creando nuevo profile ===')
          body = {
              "data": {
                  "type": "profiles",
                  "attributes": {
                      "name": "GrillaFux Distribution",
                      "profileType": "IOS_APP_STORE"
                  },
                  "relationships": {
                      "bundleId": {"data": {"type": "bundleIds", "id": BUNDLE_ID_INTERNAL}},
                      "certificates": {"data": [{"type": "certificates", "id": dist_cert_id}]}
                  }
              }
          }
          r = requests.post(f'{BASE}/profiles', headers=H(True), json=body)
          print(f'Create status: {r.status_code}')
          if r.status_code in (200, 201):
              data = r.json()['data']
              new_profile_id = data['id']
              profile_content_b64 = data['attributes'].get('profileContent', '')
              print(f'OK: profile id={new_profile_id}')
              print(f'    state={data["attributes"].get("profileState")}')
              print(f'    name={data["attributes"].get("name")}')
              print(f'    type={data["attributes"].get("profileType")}')
              # Guardar el profile content en un archivo para descargar
              if profile_content_b64:
                  print(f'\n>>> PROFILE_CONTENT_BASE64_START')
                  # Imprimir en chunks de 100 chars para que no se trunque
                  for i in range(0, len(profile_content_b64), 100):
                      print(profile_content_b64[i:i+100])
                  print(f'>>> PROFILE_CONTENT_BASE64_END')
                  print(f'\nProfile length (base64): {len(profile_content_b64)}')
          else:
              print(f'Body: {r.text[:2000]}')
          PYEOF
