name: TestFlight Submit

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number to submit'
        required: true
        default: '208'

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Submit build for beta review (auto-approves if same version)
        env:
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          BUNDLE_ID: com.basquetpass.logistica
          BUILD_NUMBER: ${{ github.event.inputs.build_number }}
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography requests
          python3 << 'PYEOF'
          import jwt, time, os, base64, requests, sys
          from cryptography.hazmat.primitives import serialization

          KEY_ID = os.environ['API_KEY_ID']
          ISSUER_ID = os.environ['ISSUER_ID']
          KEY_B64 = os.environ['API_KEY_BASE64']
          BUNDLE_ID = os.environ['BUNDLE_ID']
          BUILD_NUMBER = os.environ['BUILD_NUMBER']

          raw = KEY_B64.strip()
          if raw.startswith('-----BEGIN'):
              key_pem = raw.encode()
          else:
              try:
                  decoded = base64.b64decode(raw)
                  key_pem = decoded if b'-----BEGIN' in decoded else raw.encode()
              except Exception:
                  key_pem = raw.encode()
          private_key = serialization.load_pem_private_key(key_pem, password=None)

          def tk():
              payload = {'iss': ISSUER_ID, 'iat': int(time.time()), 'exp': int(time.time())+1200, 'aud': 'appstoreconnect-v1'}
              return jwt.encode(payload, private_key, algorithm='ES256', headers={'kid': KEY_ID, 'typ': 'JWT'})

          BASE = 'https://api.appstoreconnect.apple.com/v1'
          H = lambda ct=False: ({'Authorization': f'Bearer {tk()}', 'Content-Type': 'application/json'} if ct else {'Authorization': f'Bearer {tk()}'})

          r = requests.get(f'{BASE}/apps?filter[bundleId]={BUNDLE_ID}', headers=H())
          APP_ID = r.json()['data'][0]['id']
          print(f'App: {APP_ID}')

          r = requests.get(f'{BASE}/builds?filter[app]={APP_ID}&filter[version]={BUILD_NUMBER}&limit=1', headers=H())
          builds = r.json()['data']
          if not builds:
              print(f'ERROR: build {BUILD_NUMBER} no encontrado')
              sys.exit(1)
          BUILD_ID = builds[0]['id']
          print(f'Build {BUILD_NUMBER}: {BUILD_ID}')

          # Crear betaAppReviewSubmission
          body = {
              'data': {
                  'type': 'betaAppReviewSubmissions',
                  'relationships': {
                      'build': {'data': {'type': 'builds', 'id': BUILD_ID}}
                  }
              }
          }
          r = requests.post(f'{BASE}/betaAppReviewSubmissions', headers=H(True), json=body)
          if r.status_code in (200, 201):
              print(f'OK: build {BUILD_NUMBER} submitted for beta review (auto-aprueba si misma version)')
              print(r.text[:300])
          else:
              print(f'FAIL: {r.status_code}')
              print(r.text[:500])
              sys.exit(1)
          PYEOF
