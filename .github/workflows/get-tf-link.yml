name: Get TF Link
on:
  workflow_dispatch:
jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - name: Get public link
        env:
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          BUNDLE_ID: com.basquetpass.logistica
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography requests
          python3 << 'PYEOF'
          import jwt, time, os, base64, requests
          from cryptography.hazmat.primitives import serialization
          KEY_B64=os.environ['API_KEY_BASE64'].strip()
          key_pem = KEY_B64.encode() if KEY_B64.startswith('-----BEGIN') else (lambda d: d if b'-----BEGIN' in d else KEY_B64.encode())(base64.b64decode(KEY_B64))
          pk=serialization.load_pem_private_key(key_pem,password=None)
          tk=jwt.encode({'iss':os.environ['ISSUER_ID'],'iat':int(time.time()),'exp':int(time.time())+1200,'aud':'appstoreconnect-v1'},pk,algorithm='ES256',headers={'kid':os.environ['API_KEY_ID'],'typ':'JWT'})
          H={'Authorization':f'Bearer {tk}'}
          BASE='https://api.appstoreconnect.apple.com/v1'
          r=requests.get(f'{BASE}/apps?filter[bundleId]={os.environ["BUNDLE_ID"]}',headers=H)
          APP_ID=r.json()['data'][0]['id']
          r=requests.get(f'{BASE}/apps/{APP_ID}/betaGroups?limit=50',headers=H)
          for g in r.json()['data']:
              a=g['attributes']
              print(f'Group: {a.get("name")} | public={a.get("isInternalGroup")==False} | link={a.get("publicLink")} | linkEnabled={a.get("publicLinkEnabled")}')
          PYEOF
