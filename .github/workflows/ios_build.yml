name: iOS Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using Xcode: $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: DEBUG - Ver versiones (Imprimir archivos)
        run: |
          echo "=== PROJECT.YML CONTENT ==="
          cat project.yml
          echo "---------------------------"
          echo "=== INFO.PLIST CONTENT ==="
